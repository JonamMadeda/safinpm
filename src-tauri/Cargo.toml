[package]
name = "safinpm"
version = "0.2.0"
description = "Scan Node.js projects, rank by last opened, clean node_modules to Recycle Bin"
authors = ["safinpm"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
trash = "5"
rand = "0.9"
sysinfo = "0.36"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
